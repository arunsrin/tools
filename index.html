<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tools Hub - A collection of clean, fast, self-contained web utilities." />
    <title>Tools Hub - Simple, Self-Contained Utilities</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('tools_hub_theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
