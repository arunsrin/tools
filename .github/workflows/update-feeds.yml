name: Update News River Feeds

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Feeds
        run: python scripts/fetch_feeds.py

      - name: Commit & Push updated feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/feeds.json
          if git diff --staged --quiet; then
            echo "No feed changes detected."
          else
            git commit -m "chore(feeds): update News River headlines snapshot [skip ci]"
            git push
          fi
